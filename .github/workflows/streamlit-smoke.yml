name: Streamlit smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes openpyxl

      - name: Static runtime-risk check
        run: python -m pyflakes streamlit_app.py

      - name: Streamlit startup smoke test
        run: python tools/smoke_streamlit_app.py
